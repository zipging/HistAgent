<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">HistAgent framework</title>
  <desc id="desc">Dual-scale histology is converted to ranked molecular readouts and structured evidence for spatial reasoning.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4fb"/>
      <stop offset="1" stop-color="#dce9f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f4"/>
      <stop offset="1" stop-color="#dceee7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#29495d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527186"/>
    </marker>
  </defs>
  <rect width="1500" height="500" rx="26" fill="#fbfcfd"/>
  <text x="750" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#223b4a">From routine histology to spatial molecular evidence</text>

  <g filter="url(#shadow)">
    <rect x="45" y="105" width="220" height="295" rx="22" fill="#ffffff" stroke="#c8d8e2" stroke-width="2"/>
    <rect x="72" y="144" width="108" height="108" rx="12" fill="#f5e5ec" stroke="#cfa5bc" stroke-width="2"/>
    <circle cx="99" cy="175" r="13" fill="#b66e9a" opacity=".82"/>
    <circle cx="145" cy="183" r="17" fill="#765a9d" opacity=".7"/>
    <circle cx="113" cy="221" r="15" fill="#d391ad" opacity=".82"/>
    <circle cx="158" cy="225" r="10" fill="#835c8d" opacity=".74"/>
    <rect x="124" y="198" width="108" height="108" rx="12" fill="#f8ecf0" stroke="#d9b6c8" stroke-width="2" opacity=".95"/>
    <circle cx="153" cy="228" r="14" fill="#c1769e" opacity=".78"/>
    <circle cx="199" cy="242" r="17" fill="#7663a2" opacity=".7"/>
    <circle cx="164" cy="278" r="12" fill="#d692ad" opacity=".8"/>
    <text x="155" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#324b5b">Dual-scale H&amp;E</text>
    <text x="155" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617583">local + tissue context</text>
  </g>

  <line x1="282" y1="252" x2="342" y2="252" stroke="#527186" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="105" width="300" height="295" rx="22" fill="url(#blue)" stroke="#8fb2cf" stroke-width="2"/>
    <rect x="402" y="148" width="216" height="78" rx="15" fill="#ffffff" stroke="#afc7da"/>
    <text x="510" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2f5f83">GigaPath encoder</text>
    <text x="510" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#607b8f">LoRA adapted</text>
    <line x1="510" y1="229" x2="510" y2="264" stroke="#6c8ea7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="402" y="276" width="216" height="76" rx="15" fill="#ffffff" stroke="#afc7da"/>
    <text x="510" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2f5f83">Gene decoder</text>
    <text x="510" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#607b8f">autoregressive ranking</text>
    <text x="510" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#244f6c">Visual-omics foundation model</text>
  </g>

  <line x1="677" y1="252" x2="737" y2="252" stroke="#527186" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="755" y="105" width="225" height="295" rx="22" fill="#ffffff" stroke="#bdcad2" stroke-width="2"/>
    <text x="867" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#384f5d">Ranked molecular readout</text>
    <rect x="801" y="176" width="132" height="165" rx="14" fill="#f5f7fa" stroke="#d4dce2"/>
    <text x="823" y="209" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2f667d">1</text>
    <text x="860" y="209" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#263c49">ERBB2</text>
    <text x="823" y="241" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#47758a">2</text>
    <text x="860" y="241" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#263c49">TP53</text>
    <text x="823" y="273" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#66889a">3</text>
    <text x="860" y="273" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#263c49">CD68</text>
    <text x="867" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#778995">⋮</text>
    <text x="867" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#617583">top 50 genes</text>
    <text x="867" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617583">image-conditioned</text>
  </g>

  <line x1="997" y1="252" x2="1057" y2="252" stroke="#527186" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1075" y="105" width="380" height="295" rx="22" fill="url(#green)" stroke="#92bca9" stroke-width="2"/>
    <rect x="1110" y="146" width="310" height="82" rx="15" fill="#ffffff" stroke="#b4d0c4"/>
    <text x="1265" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#386b57">Structured evidence</text>
    <text x="1265" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#657d72">genes · cell composition · programmes · context</text>
    <line x1="1265" y1="231" x2="1265" y2="266" stroke="#658c7a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1110" y="278" width="310" height="78" rx="15" fill="#ffffff" stroke="#b4d0c4"/>
    <text x="1265" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#386b57">Question-driven reasoning</text>
    <text x="1265" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#657d72">multi-turn answers linked to evidence</text>
    <text x="1265" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#315f4e">Spatial reasoning agent</text>
  </g>

  <text x="750" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#617583">Rank-based molecular inference  ·  standard spatial analyses  ·  evidence-grounded interpretation</text>
</svg>
