<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 68" fill="none">
  <title>HistAgent: tissue slide, magnification and gene readout</title>
  <!-- The specimen slide enters on the upper-left diagonal. -->
  <g transform="rotate(34 22 18)" stroke="#233c50" stroke-width="1.8" stroke-linejoin="round">
    <rect x="4" y="9" width="35" height="18" rx="1.6" fill="#f4f7fa"/>
    <path d="M12 9v18"/>
    <path d="M7 14h2M7 18h2" stroke="#8294a1" stroke-width="1.3"/>
    <path d="M20 14c4-3 10-1 12 3 2 4-3 7-7 5-4 1-8-4-5-8Z" fill="#ba8ba9" stroke="none"/>
  </g>
  <!-- The lens is the central hinge between morphology and genes. -->
  <circle cx="33" cy="29" r="12" fill="white" stroke="#233c50" stroke-width="2.5"/>
  <path d="M26 26c2-4 7-5 11-2 3 3 1 8-3 10-4 2-9-2-8-5" fill="#e8d3e1"/>
  <path d="m29 25 2 3m4-2-1 4m-5 1 2 1" stroke="#946284" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m42 38 7 7" stroke="#233c50" stroke-width="4" stroke-linecap="round"/>
  <!-- A compact gene motif completes the lower-right diagonal. -->
  <g stroke="#245bc4" stroke-width="1.9" stroke-linecap="round">
    <path d="M53 43c0 5 12 6 12 11s-12 6-12 11M65 43c0 5-12 6-12 11s12 6 12 11"/>
    <path d="M54 45h10m-7 6h4m-6 6h8m-7 5h6" stroke-width="1.4"/>
  </g>
</svg>
